namespace: ADAS

runnables:
  # Camera sensor runnable - SOURCE node
  - unique_name: CameraController
    runnabletype: CPU
    wcet_us: 5000           # 5ms worst case execution time
    min_interval_us: 33333  # 30 FPS maximum rate
    max_interval_us: 50000  # 20 FPS minimum rate
    parameter_header: "parameters/CameraControllerParameters.yaml"
    internal_state_header: "internal_states/CameraState.yaml"
    outputs:
      - unique_name: camera_frames
        type_name: adas::perception::CameraFrame
        n_samples_max: 1
        n_slots: 3  # Producer + 2 consumers (neural_net + logging)
        memory_backend: PosixShm
    build_information:
      bazel_target: "src/ADAS/CameraController:CameraController"

  # Neural network inference runnable - INTERMEDIATE node
  - unique_name: NeuralNetInference
    runnabletype: GPU
    wcet_us: 25000          # 25ms for inference
    min_interval_us: 30000  # Must process at least every 30ms
    max_interval_us: 40000  # Maximum latency allowance
    parameter_header: "parameters/NeuralNetParameters.yaml"
    internal_state_header: "internal_states/NeuralNetState.yaml"
    inputs:
      - unique_name: input_frames
        type_name: adas::perception::CameraFrame
        n_samples_min: 1    # Need at least 1 frame
        n_samples_max: 2    # Can batch process up to 2 frames
        policy: kLastN      # Process all available frames
    outputs:
      - unique_name: detections
        type_name: adas::perception::ObjectDetections
        n_samples_max: 1
        n_slots: 4  # Producer + 3 consumers (brake_controller + traffic_sign + logging)
        memory_backend: PosixShm
    build_information:
      bazel_target: "src/ADAS/NeuralNetInference:NeuralNetInference"

  # Traffic Sign Recognition runnable - SEQUENTIAL INTERMEDIATE node
  - unique_name: TrafficSignRecognition
    runnabletype: GPU
    wcet_us: 10000          # 10ms for traffic sign processing (using pre-detected objects)
    min_interval_us: 100000 # 10 Hz - signs don't change frequently
    max_interval_us: 200000 # 5 Hz minimum rate for sign updates
    parameter_header: "parameters/TrafficSignParameters.yaml"
    internal_state_header: "internal_states/TrafficSignState.yaml"
    inputs:
      - unique_name: object_detections
        type_name: adas::perception::ObjectDetections
        n_samples_min: 1    # Need object detection results for sign analysis
        n_samples_max: 1    # Process one detection frame at a time
        policy: kNewestN    # Use most recent detection results
    outputs:
      - unique_name: traffic_sign_commands
        type_name: adas::perception::TrafficSignCommand
        n_samples_max: 1
        n_slots: 2  # Producer + 1 consumer (logging/monitoring)
        memory_backend: PosixShm
    build_information:
      bazel_target: "src/ADAS/TrafficSignRecognition:TrafficSignRecognition"

  # Brake controller runnable - SINK node
  - unique_name: BrakeController
    runnabletype: CPU
    wcet_us: 2000           # 2ms critical response time
    min_interval_us: 10000  # 100 Hz maximum rate for safety
    max_interval_us: 20000  # 50 Hz minimum rate
    parameter_header: "parameters/BrakeControllerParameters.yaml"
    internal_state_header: "internal_states/BrakeControllerState.yaml"
    inputs:
      - unique_name: object_detections
        type_name: adas::perception::ObjectDetections
        n_samples_min: 1    # Always need detection data
        n_samples_max: 1    # Process latest detection only
        policy: kNewestN    # Always use most recent
    outputs:
      - unique_name: brake_commands
        type_name: adas::perception::BrakeCommand
        n_samples_max: 1
        n_slots: 2  # Producer + 1 consumer (logging/tracing)
        memory_backend: PosixShm
    build_information:
      bazel_target: "src/ADAS/BrakeController:BrakeController"

  # Independent logging service - SINK node
  - unique_name: SystemLogger
    runnabletype: CPU
    wcet_us: 1000           # 1ms for logging operations
    min_interval_us: 5000   # 200 Hz maximum logging rate
    max_interval_us: 100000 # 10 Hz minimum flush rate
    parameter_header: "parameters/LoggerParameters.yaml"
    internal_state_header: "internal_states/LoggerState.yaml"
    inputs:
      - unique_name: camera_data_log
        type_name: adas::perception::CameraFrame
        n_samples_min: 0    # Optional logging
        n_samples_max: 5    # Batch log up to 5 frames
        policy: kLastN      # Log all available
      - unique_name: detection_log
        type_name: adas::perception::ObjectDetections
        n_samples_min: 0    # Optional logging  
        n_samples_max: 5    # Batch log up to 5 detections
        policy: kLastN      # Log all available
      - unique_name: brake_command_log
        type_name: adas::perception::BrakeCommand
        n_samples_min: 0    # Optional logging
        n_samples_max: 10   # Batch log brake commands
        policy: kLastN      # Log all available
      - unique_name: traffic_sign_log
        type_name: adas::perception::TrafficSignCommand
        n_samples_min: 0    # Optional logging
        n_samples_max: 5    # Batch log traffic sign detections
        policy: kLastN      # Log all available
    outputs:
      - unique_name: log_entries
        type_name: adas::perception::LogEntry
        n_samples_max: 10   # Batch output log entries
        n_slots: 2
        memory_backend: PosixShm
    build_information:
      bazel_target: "src/ADAS/SystemLogger:SystemLogger"

  # Independent tracing/performance monitoring - SINK node
  - unique_name: PerformanceTracer
    runnabletype: CPU
    wcet_us: 500            # 0.5ms for trace operations
    min_interval_us: 1000   # 1kHz maximum tracing rate
    max_interval_us: 10000  # 100Hz minimum monitoring rate
    parameter_header: "parameters/TracerParameters.yaml"
    internal_state_header: "internal_states/TracerState.yaml"
    inputs:
      - unique_name: camera_perf_trace
        type_name: adas::perception::CameraFrame
        n_samples_min: 0    # Optional tracing
        n_samples_max: 3    # Monitor recent frames
        policy: kNewestN    # Keep latest for performance analysis
      - unique_name: neural_net_perf_trace
        type_name: adas::perception::ObjectDetections
        n_samples_min: 0    # Optional tracing
        n_samples_max: 3    # Monitor recent inferences
        policy: kNewestN    # Keep latest for performance analysis
      - unique_name: brake_perf_trace
        type_name: adas::perception::BrakeCommand
        n_samples_min: 0    # Optional tracing
        n_samples_max: 10   # Monitor brake command patterns
        policy: kNewestN    # Keep latest commands
      - unique_name: traffic_sign_perf_trace
        type_name: adas::perception::TrafficSignCommand
        n_samples_min: 0    # Optional tracing
        n_samples_max: 3    # Monitor traffic sign performance
        policy: kNewestN    # Keep latest for analysis
    outputs:
      - unique_name: performance_traces
        type_name: adas::perception::PerformanceTrace
        n_samples_max: 5    # Batch performance data
        n_slots: 2
        memory_backend: PosixShm
    build_information:
      bazel_target: "src/ADAS/PerformanceTracer:PerformanceTracer"